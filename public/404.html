<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deepak — Software Developer</title>
    <script>
      // GitHub Pages SPA fallback — redirect to index with path preserved
      ;(function () {
        var base = '/Deepak-Portfolio/'
        var path = window.location.pathname.replace(base, '/')
        var search = window.location.search
        var hash = window.location.hash
        window.location.replace(base + '?p=' + encodeURIComponent(path + search + hash))
      })()
    </script>
  </head>
  <body></body>
</html>
